[project]
name = "my_app"
version = "0.1.0"
description = "Template for a Flask web app with logging, tests, Docker, CI and docs"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "requests==2.34.2",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["my_app*"]

[tool.black]
line-length = 79

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
